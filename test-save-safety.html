<!doctype html><meta charset="utf-8"><body>
<input id="close-month-year" value="2026"><input id="close-month-month" value="7">
<div id="close-month-preview"></div>
<!-- archive.js の closeCloseMonth() が閉じにいく確認ダイアログ（本物と同じ id） -->
<div id="confirm-close-month" class="confirm-overlay open"></div>
<script>
window.__toasts=[]; window.showToast=function(m){ window.__toasts.push(m); };
window.closeCloseMonth=function(){}; window.renderAll=function(){}; window.renderDashboard=function(){};
window.addLog=function(){}; window.fmtPrice=function(v){return String(v);};
window.ymKeyFromYM=function(y,m){ return y+'-'+String(m).padStart(2,'0'); };
window.cars=[]; window.archivedCars=[];
/* 「納車完了で、その年月に納車された車」を返す＝本物と同じ役目の最小版 */
window.getCloseMonthTargets=function(y,m){
  return cars.filter(function(c){ return c.col==='done' && c.deliveryDate &&
    c.deliveryDate.slice(0,7)===y+'-'+String(m).padStart(2,'0'); });
};
/* 偽のDB：id が 'NG' で始まる車は保存に失敗する／'DELNG' は削除に失敗する */
window.__saved=[]; window.__deleted=[];
window.dbArchive={ saveArchivedCar:function(c){
  if(String(c.id).indexOf('NG')===0) return Promise.reject(new Error('permission-denied'));
  window.__saved.push(c.id); return Promise.resolve(); } };
window.dbCars={ deleteCar:function(id){
  if(String(id).indexOf('DELNG')===0) return Promise.reject(new Error('permission-denied'));
  window.__deleted.push(id); return Promise.resolve(); } };
window.backoffice={ cleanupExpiredArchivedPhotos:function(){ return 0; } };
</script>
<script src="js/archive.js"></script>
<script>window.__ready=1;</script>
