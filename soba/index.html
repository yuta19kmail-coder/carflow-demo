<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>相場ビュー</title>
<!--
  CarFlow ▸ セールス ▸ 相場ビュー（v3.8.0・2026-10-10）
  CarFlow の index.html の panel-soba の iframe で開く。単体で開いてもログイン情報が無いので何も出ない。
  データ＝soba-data.js（Storage の soba/v1/）／画面＝view.js（相場DB の相場ビューアの写し）／計算＝soba-calc.js（Storage から）
  🔴 このフォルダに相場データ（json）を置かない。Hosting に乗る＝誰でも落とせる
-->
<!-- CoreFlow 共通の見た目の基準（ボタンの大きさ・角の丸み・スクロールの棒）。CarFlow 本体と同じファイル（_shared から配られた物） -->
<link rel="stylesheet" href="../css/coreflow-ui.css?v=3.11.0">
<style>
/* 色：土台（背景・文字・線）は CarFlow のテーマから借りる（下の script）。意味の色（小売＝青・AA＝橙・良し悪し）は相場ビューアと同じ */
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--sub:#667085;--line:#e3e6eb;--chip:#eef2f7;
 --rt:#2563eb;--aa:#dc6b19;--ok:#0f766e;--okbg:#e6f5f2;--mid:#a16207;--midbg:#fdf6e3;--ng:#b91c1c;--ngbg:#fdecec;--c2:#7c3aed;--c3:#0d9488}
:root.dk{--bg:#12151b;--card:#1b2029;--ink:#e6e9ef;--sub:#98a2b3;--line:#2b3340;--chip:#252c38;
 --rt:#6ea0ff;--aa:#f59e57;--ok:#2dd4bf;--okbg:#10302c;--mid:#facc15;--midbg:#332b10;--ng:#f87171;--ngbg:#3a1a1a;--c2:#b794f6;--c3:#2dd4bf}
.sbdemo{flex:none;padding:5px 16px;font-size:12px;background:var(--midbg);color:var(--mid);border-bottom:1px solid var(--line)}
.sbmsg{margin:24px 0;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);line-height:1.8}
</style>
<script>
// CarFlow のテーマ（data-theme）に合わせる。変わったらついて行く
(function(){
 const P=(()=>{try{return window.parent}catch(e){return null}})(),R=document.documentElement;
 function sync(){try{
  const pr=P.document.documentElement,th=pr.getAttribute('data-theme')||'dark',cs=P.getComputedStyle(pr);
  R.classList.toggle('dk',!/light/.test(th));
  [['--bg','--bg'],['--card','--bg2'],['--ink','--text'],['--sub','--text2'],['--line','--border'],['--chip','--bg3'],['--cfb','--blue'],['--cfr','--r'],['--cft3','--text3']].forEach(([a,b])=>{const v=cs.getPropertyValue(b).trim();if(v)R.style.setProperty(a,v);else R.style.removeProperty(a)});
 }catch(e){}}
 sync();
 try{new P.MutationObserver(sync).observe(P.document.documentElement,{attributes:true,attributeFilter:['data-theme','style','class']})}catch(e){}
})();
</script>
<link rel="stylesheet" href="view.css?v=4.0.0">
<style>
/* ===== CarFlow に寄せる（2026-10-10 ゆうた「スクロールやボタンは CarFlow に寄せて」）=====
   view.css（相場ビューアの写し）には手を入れず、ここで上書きする。中身と並びはビューアのまま */
:root{--cfb:#378ADD;--cfr:8px;--cft3:#5c6490;--acc:var(--cfb)}
/* 上の帯：CarFlow のヘッダーの下に入るので小さく */
header{padding:8px 16px;gap:10px}
h1{font-size:14px}
/* スクロール：左の一覧と右の中身がそれぞれ動く（CarFlow のサイドバーと中身と同じ）。棒は coreflow-ui.css の細い棒 */
@media (min-width:761px){
 html,body{height:100%;overflow:hidden}
 body{display:flex;flex-direction:column}
 header{position:static;flex:none}
 .wrap{flex:1;min-height:0;grid-template-columns:240px minmax(0,1fr)}
 nav{position:static;max-height:none;height:100%;overflow-y:auto;overscroll-behavior:contain}
 main{height:100%;overflow-y:auto;max-width:none;overscroll-behavior:contain}
 main>*{max-width:1400px}
}
/* 左の一覧＝CarFlow のサイドバーと同じ形（角丸の行・押した行は青） */
nav{background:var(--card);padding:4px 0 12px}
nav .mkh{background:var(--card);border-bottom:0;font-size:11px;letter-spacing:.06em;color:var(--cft3);padding:10px 14px 4px}
nav .mkh:hover{color:var(--ink)}
nav button{border-bottom:0;border-radius:var(--cfr);margin:1px 6px;width:calc(100% - 12px);padding:7px 11px;font-size:13px;color:var(--sub);transition:background .15s,color .15s}
nav button:hover{background:var(--chip);color:var(--ink)}
nav button.on,nav button.child.on{background:color-mix(in srgb,var(--cfb) 15%,transparent);color:var(--cfb);font-weight:600}
nav button.grp.has{color:var(--ink)}
nav button.child{background:transparent;padding-left:26px;font-size:12.5px}
nav button.child.c2{padding-left:40px}
/* ボタン＝CarFlow の小さいボタン（枠・角丸6px）。選んでいる物は CarFlow の青 */
.years button,.chtool button,.addcmp,.cmpdlg .res button,.kmsw button{font:inherit;font-size:var(--ui-btn-fs,12.5px);border:1px solid var(--line);border-radius:var(--ui-r-sm,6px);background:transparent;color:var(--sub);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.years button{padding:4px 11px}
.chtool button{padding:3px 10px}
.addcmp{padding:6px 12px;color:var(--ink)}
.years button:hover,.chtool button:hover,.addcmp:hover:not(:disabled),.cmpdlg .res button:hover{background:var(--chip);color:var(--ink);border-color:var(--sub)}
.years button.on,.chtool button.on,.cmpdlg .res button.on,.kmsw button.on{background:color-mix(in srgb,var(--cfb) 15%,transparent);color:var(--cfb);border-color:color-mix(in srgb,var(--cfb) 55%,transparent);font-weight:600}
.kmsw{border-radius:var(--ui-r-sm,6px)}.kmsw button{border:0;border-radius:0}
.chtool button:disabled,.addcmp:disabled{opacity:.4;cursor:not-allowed}
/* 入力欄・選ぶ欄＝CarFlow の欄（角丸8px・押すと青い枠） */
input,select{border-radius:var(--cfr);border-color:var(--line);background:var(--bg)}
input:focus,select:focus{outline:none;border-color:var(--cfb);box-shadow:0 0 0 2px color-mix(in srgb,var(--cfb) 25%,transparent)}
/* 特殊車両枠の「参考」の札（注意の札と並ぶ・灰色の点線） */
.cnote span.sp{background:var(--chip);color:var(--sub);border:1px dashed var(--sub)}
/* 枠の下の「▾ 詳細」＝CarFlow の青 */
.boxmore,.nowmore,.rvclose,.rvarrow{color:var(--cfb)}
/* ===== v3.10.0 車両詳細の［相場］タブ（?car=＝html.emb）：左の一覧と上の帯を出さず、中身だけ。上に「この車 → 相場カードと条件」の1枚（embed.js） ===== */
html.emb header,html.emb nav{display:none!important}
html.emb .wrap{grid-template-columns:minmax(0,1fr)!important;min-height:0}
html.emb main{padding-top:12px}
@media (min-width:1px){html.emb,html.emb body{height:100%;overflow:hidden}html.emb body{display:flex;flex-direction:column}html.emb .wrap{flex:1;min-height:0;display:grid}html.emb main{height:100%;overflow-y:auto;max-width:none}}
.emb-card{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 14px;margin:0 0 14px;font-size:13px;line-height:1.6}
.emb-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:3px 0}
.emb-lb{flex:0 0 74px;font-size:11.5px;color:var(--sub)}
.emb-cond{color:var(--ink)}
.emb-row select{max-width:min(100%,360px);font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line);color:var(--ink)}
.emb-w{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;background:var(--midbg);color:var(--mid);cursor:help}
.emb-miss{color:var(--ng);font-weight:600}
.emb-moved{color:var(--mid);font-size:12.5px}
.emb-btn,.emb-lnk{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--cfb);padding:3px 10px;cursor:pointer}
.emb-lnk{border:0;padding:0 4px;text-decoration:underline}
.emb-btn:hover{background:var(--chip)}
.emb-px{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line)}
.emb-px>div{display:flex;flex-direction:column;min-width:120px}
.emb-px .k{font-size:11.5px;color:var(--sub)}
.emb-px b{font-size:20px;line-height:1.3}
.emb-px small{font-size:11.5px;color:var(--sub)}
.emb-hint{font-size:11.5px;color:var(--sub);margin-top:4px}
.emb-stamp{margin-left:auto;font-size:11px;color:var(--sub)}
.emb-ok{color:var(--ok)}.emb-ok2{color:var(--ok)}.emb-mid{color:var(--mid)}.emb-ng{color:var(--ng)}
/* 「この車について」を記事として読みやすく（2026-10-19 ゆうた「見出しの部分だけもうちょいでかく。コラムというか記事としてもうちょい見やすく」）。view.css は触らずここで上書き */
.about{padding:10px 18px 14px}
.about>summary{font-size:15px;color:var(--ink);padding:4px 0}
.about .ab{max-width:880px;padding:6px 0 10px}
.about .ab+.ab{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.about .ab h4{font-size:19px;font-weight:800;color:var(--ink);margin:14px 0 10px;padding-bottom:7px;border-bottom:2px solid var(--cfb);line-height:1.4}
.about .ab h5{font-size:15.5px;font-weight:800;color:var(--ink);margin:20px 0 7px;padding-left:10px;border-left:4px solid var(--cfb);line-height:1.35}
.about .ab h4+h5{margin-top:10px}
.about .ab ul{margin:0 0 6px 20px}
.about .ab li{font-size:14px;line-height:1.85;margin:0 0 3px}
.about .abl{font-size:12px;margin:2px 0 6px}
.about .abt{margin:4px 0 6px}
.about .src{margin-top:14px}
</style>
</head>
<body>
<header>
  <h1>相場ビュー</h1>
  <input id="q" placeholder="車種・型式でさがす" size="16">
  <span class="stamp" id="stamp"></span>
</header>
<div class="wrap">
  <nav id="list"></nav>
  <main id="main"></main>
</div>
<div id="tip"></div>
<script src="tip.js?v=3.18.1"></script>
<script src="soba-data.js?v=4.5.5"></script>
<!-- 🌐 v3.16.7（棚卸し A-69）英語表示。この画面はログインを持たないので、親（CarFlow 本体）の英語の切り替えに付いて行く。
     辞書は親が読み込んだ物を借りる（無ければ自分で読む）。車名・型式の一覧（左の列）は入力データなので訳さない -->
<script src="../js/coreflow-en.js?v=2fa30ac1" data-dict="../js/coreflow-en-dict.js?v=5323e348"></script>
<script>
(function(){
 var P=(function(){try{return window.parent!==window?window.parent:null}catch(e){return null}})();
 var L=document.getElementById('list'); if(L) L.setAttribute('data-cf-noen','');
 if(!P||!window.CFEn) return;
 function sync(){try{
  var pe=P.CFEn; if(!pe) return;
  if(P.CF_EN_DICT && !window.CF_EN_DICT) window.CF_EN_DICT=P.CF_EN_DICT;
  if(window.CFEn.flag()!==pe.flag()) window.CFEn._flag(pe.flag());
  if(pe.flag() && window.CFEn.on()!==pe.on()) window.CFEn.toggle();
 }catch(e){}}
 sync();
 try{new P.MutationObserver(sync).observe(P.document.documentElement,{attributes:true,attributeFilter:['class']})}catch(e){}
 setTimeout(sync,1500);
})();
</script>
</body>
</html>
