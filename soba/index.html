<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>相場ビュー</title>
<!--
  CarFlow ▸ セールス ▸ 相場ビュー（v3.8.0・2026-10-10）
  CarFlow の index.html の panel-soba の iframe で開く。単体で開いてもログイン情報が無いので何も出ない。
  データ＝soba-data.js（Storage の soba/v1/）／画面＝view.js（相場DB の相場ビューアの写し）／計算＝soba-calc.js（Storage から）
  🔴 このフォルダに相場データ（json）を置かない。Hosting に乗る＝誰でも落とせる
-->
<style>
/* 色：土台（背景・文字・線）は CarFlow のテーマから借りる（下の script）。意味の色（小売＝青・AA＝橙・良し悪し）は相場ビューアと同じ */
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--sub:#667085;--line:#e3e6eb;--chip:#eef2f7;
 --rt:#2563eb;--aa:#dc6b19;--ok:#0f766e;--okbg:#e6f5f2;--mid:#a16207;--midbg:#fdf6e3;--ng:#b91c1c;--ngbg:#fdecec;--c2:#7c3aed;--c3:#0d9488}
:root.dk{--bg:#12151b;--card:#1b2029;--ink:#e6e9ef;--sub:#98a2b3;--line:#2b3340;--chip:#252c38;
 --rt:#6ea0ff;--aa:#f59e57;--ok:#2dd4bf;--okbg:#10302c;--mid:#facc15;--midbg:#332b10;--ng:#f87171;--ngbg:#3a1a1a;--c2:#b794f6;--c3:#2dd4bf}
.sbmsg{margin:24px 0;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);line-height:1.8}
</style>
<script>
// CarFlow のテーマ（data-theme）に合わせる。変わったらついて行く
(function(){
 const P=(()=>{try{return window.parent}catch(e){return null}})(),R=document.documentElement;
 function sync(){try{
  const pr=P.document.documentElement,th=pr.getAttribute('data-theme')||'dark',cs=P.getComputedStyle(pr);
  R.classList.toggle('dk',!/light/.test(th));
  [['--bg','--bg'],['--card','--bg2'],['--ink','--text'],['--sub','--text2'],['--line','--border'],['--chip','--bg3']].forEach(([a,b])=>{const v=cs.getPropertyValue(b).trim();if(v)R.style.setProperty(a,v);else R.style.removeProperty(a)});
 }catch(e){}}
 sync();
 try{new P.MutationObserver(sync).observe(P.document.documentElement,{attributes:true,attributeFilter:['data-theme','style','class']})}catch(e){}
})();
</script>
<link rel="stylesheet" href="view.css?v=3.8.1">
<style>
/* CarFlow の中に収める（上の帯は CarFlow のヘッダーがあるので小さく） */
header{padding:8px 16px}
h1{font-size:15px}
.wrap{min-height:calc(100vh - 50px)}nav{top:50px;max-height:calc(100vh - 50px)}
</style>
</head>
<body>
<header>
  <h1>相場ビュー</h1>
  <input id="q" placeholder="車種・型式でさがす" size="16">
  <span class="stamp" id="stamp"></span>
</header>
<div class="wrap">
  <nav id="list"></nav>
  <main id="main"></main>
</div>
<div id="tip"></div>
<script src="tip.js?v=3.8.1"></script>
<script src="soba-data.js?v=3.8.1"></script>
</body>
</html>
