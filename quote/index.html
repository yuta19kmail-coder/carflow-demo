<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>見積</title>
<!--
  CarFlow ▸ セールス ▸ 見積・原価管理（v4.0.0・2026-10-23）
  CarFlow の index.html の panel-quote の iframe で開く。単体で開いてもログイン情報が無いので何も出ない。
  画面と計算＝quote.js（見積モック v4.83.0 を本物に移した物）／見た目＝quote.css（色は CarFlow のトークンだけ）
  データ＝quote-data.js（車は親の CarFlow から・見積は Firestore companies/{会社}/carQuotes/{車のID}・設定は settings/quote・
          相場は相場ビューと同じ Storage soba/v1/ を soba-calc.js で）
  🔴 このフォルダに相場データ・社内の写真を置かない。Hosting に乗る＝誰でも落とせる
-->
<link rel="stylesheet" href="../css/base.css?v=4.0.0">
<link rel="stylesheet" href="../css/layout.css?v=4.0.0">
<link rel="stylesheet" href="../css/components.css?v=4.0.0">
<link rel="stylesheet" href="../css/panels.css?v=4.0.0">
<link rel="stylesheet" href="../css/modal.css?v=4.0.0">
<link rel="stylesheet" href="../css/coreflow-ui.css?v=4.0.0">
<link rel="stylesheet" href="quote.css?v=4.5.22">
<style id="q-page">@page{size:A4 portrait;margin:0}</style>
<style>
/* iframe の中＝サイドバーと上の帯は CarFlow 本体の物。ここは中身だけ */
html,body{height:100%}
body{overflow:hidden;background:var(--bg)}
#app{height:100%}
#app .views{flex:1;display:flex;min-height:0;min-width:0}
.q-boot{margin:40px auto;max-width:520px;padding:16px 18px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);line-height:1.8;color:var(--text2)}
/* v4.5.22 🗣 2026-10-24「設定の見積もりと原価が枠の中に枠があって本体みたいになっている。ちゃんと作り直して」
   ＝CarFlow の設定 ▸ 見積・原価（app＝set・cgset）は枠を見せない：背景なし・中でスクロールしない・高さは中身に合わせて親の iframe を伸ばす（下の script） */
html[data-embed],html[data-embed] body{height:auto;overflow:hidden;background:transparent}
html[data-embed] #app{height:auto}
</style>
<script>/* 設定の中で開いた時だけ（app＝set・cgset）。quote.css の .q-embed と組 */
(function(){ var a = new URLSearchParams(location.search).get('app'); if (a === 'set' || a === 'cgset') document.documentElement.setAttribute('data-embed', '1'); })();</script>
</head>
<body>
<div id="app">
  <div class="views"><div class="q-root" id="q-root"><div class="q-boot" id="q-boot">見積を読み込み中…</div></div><div class="soba-panel" id="soba-panel" hidden></div></div>
</div>
<div class="q-ov" id="q-ov" hidden></div>
<div class="q-docov" id="q-docov" hidden></div>
<div class="q-toast" id="q-toast" hidden><span id="q-toast-msg"></span><button id="q-toast-undo">元に戻す</button></div>
<span id="q-saved" hidden></span>
<script>/* v4.5.22 設定の中（q-embed）：①親の iframe の高さを中身に合わせる ②窓（q-ov）とお知らせ（q-toast）を、親の画面で見えている所に出す（iframe が縦に長いので）
   見えている所＝--vt（iframe の上からの位置）・--vh（高さ）を親のスクロールのたびに入れ直す */
(function(){
  if (!document.documentElement.hasAttribute('data-embed')) return;
  var fe = null, P = null; try { fe = window.frameElement; P = window.parent; } catch (e) {}
  if (!fe || !P) return;
  function fit(){ var app = document.getElementById('app'); if (!app) return; var h = Math.max(200, Math.ceil(app.getBoundingClientRect().height) + 8); if (Math.abs((parseFloat(fe.style.height) || 0) - h) > 2) fe.style.height = h + 'px'; vis(); }
  /* 見えている所＝親の画面の中で、スクロールの枠（設定の中身の枠など・上の帯の下）と重なっている所 */
  function vis(){ var r = fe.getBoundingClientRect(), t = Math.max(0, r.top), b = Math.min(P.innerHeight, r.bottom);
    for (var p = fe.parentElement; p && p !== P.document.body; p = p.parentElement) { var oy = P.getComputedStyle(p).overflowY; if (oy === 'visible') continue; var q = p.getBoundingClientRect(); t = Math.max(t, q.top); b = Math.min(b, q.bottom); }
    var s = document.documentElement.style; s.setProperty('--vt', Math.max(0, t - r.top) + 'px'); s.setProperty('--vh', Math.max(160, b - t) + 'px'); }
  try { new ResizeObserver(fit).observe(document.getElementById('app')); } catch (e) { setInterval(fit, 800); }
  P.addEventListener('scroll', vis, true); P.addEventListener('resize', fit);
  window.addEventListener('load', fit); fit();
})();
</script>
<script src="../js/coreflow-icons.js?v=4.0.0"></script>
<script src="../js/car-class.js?v=4.0.0"></script>
<script src="vendor/qrcode-generator-2.0.4.js"></script><!-- v4.5.22 帳票の LINE の QR（MIT・Kazuhiko Arase） -->
<script src="quote-data.js?v=4.5.22"></script>
<!-- 🔐 写真（車のカードの写真）は鍵つきの住所では開けない（2026-10-20 セキュリティの直し）＝CarFlow 本体と同じ CFFile が、ログインの合札で取ってきて blob: に差し替える（読み込むと自動で見張る）。
     🗣 2026-10-23「サムネの画像が表示されない」。⚠ ?v= は sync-shared.ps1 が直さない（本体の index.html と同じ番号に手で） -->
<script src="../js/coreflow-file.js?v=d877de25"></script>
<!-- 🌐 英語表示。この画面はログインを持たないので、親（CarFlow 本体）の英語の切り替えに付いて行く（相場ビューと同じ）。
     辞書は親が読み込んだ物を借りる（無ければ自分で読む）。お客様に出す帳票（見積書）は訳さない（data-cf-noen） -->
<script src="../js/coreflow-en.js?v=2fa30ac1" data-dict="../js/coreflow-en-dict.js?v=a72f29bd"></script>
<script>
(function(){
 var P=(function(){try{return window.parent!==window?window.parent:null}catch(e){return null}})();
 var D=document.getElementById('q-docov'); if(D) D.setAttribute('data-cf-noen','');
 if(!P||!window.CFEn) return;
 function sync(){try{
  var pe=P.CFEn; if(!pe) return;
  if(P.CF_EN_DICT && !window.CF_EN_DICT) window.CF_EN_DICT=P.CF_EN_DICT;
  if(window.CFEn.flag()!==pe.flag()) window.CFEn._flag(pe.flag());
  if(pe.flag() && window.CFEn.on()!==pe.on()) window.CFEn.toggle();
 }catch(e){}}
 sync();
 try{new P.MutationObserver(sync).observe(P.document.documentElement,{attributes:true,attributeFilter:['class']})}catch(e){}
 setTimeout(sync,1500);
})();
</script>
</body>
</html>
